# Providers API schemas

ProviderStatus:
  type: string
  enum: [active, error, deleted]
  description: Status of the provider

NetworkConfig:
  type: object
  description: Network configuration for provider connections
  properties:
    base_url:
      type: string
      description: Base URL for the provider (optional)
    extra_headers:
      type: object
      additionalProperties:
        type: string
      description: Additional headers to include in requests
    default_request_timeout_in_seconds:
      type: integer
      description: Default timeout for requests
    max_retries:
      type: integer
      description: Maximum number of retries
    retry_backoff_initial:
      type: integer
      format: int64
      description: Initial backoff duration in milliseconds
    retry_backoff_max:
      type: integer
      format: int64
      description: Maximum backoff duration in milliseconds
    insecure_skip_verify:
      type: boolean
      description: Disable TLS certificate verification for provider connections. This bypasses server certificate validation and should be used only as a last resort when a trusted CA chain cannot be configured. Prefer ca_cert_pem for self-signed or private CA deployments.
    ca_cert_pem:
      type: string
      description: PEM-encoded CA certificate to trust for provider endpoint connections (e.g. self-signed or internal CA)
    allow_private_network:
      type: boolean
      default: false
      description: Allow connections to RFC 1918 private IPs (10.x, 172.16.x, 192.168.x). Enable for providers on a k8s pod network, LAN, or private VPC. Loopback addresses (localhost, 127.0.0.1, ::1) remain allowed regardless of this setting. Link-local addresses (169.254.x.x) are always blocked.

ConcurrencyAndBufferSize:
  type: object
  description: Concurrency settings
  properties:
    concurrency:
      type: integer
      description: Number of concurrent operations
    buffer_size:
      type: integer
      description: Size of the buffer

ProxyConfig:
  type: object
  description: Proxy configuration
  properties:
    type:
      type: string
      enum: [none, http, socks5, environment]
    url:
      type: string
    username:
      type: string
    password:
      type: string
    ca_cert_pem:
      type: string

AzureKeyConfig:
  type: object
  description: Azure-specific key configuration
  properties:
    endpoint:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    api_version:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    client_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    client_secret:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    tenant_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    scopes:
      type: array
      items:
        type: string
      description: List of scopes to use for authentication

VertexKeyConfig:
  type: object
  description: Vertex-specific key configuration
  properties:
    project_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    project_number:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    region:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    auth_credentials:
      $ref: '../../schemas/management/common.yaml#/EnvVar'

BedrockKeyConfig:
  type: object
  description: AWS Bedrock-specific key configuration
  properties:
    access_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    secret_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    session_token:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    region:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    arn:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    batch_s3_config:
      type: object
      properties:
        buckets:
          type: array
          items:
            type: object
            properties:
              bucket_name:
                type: string
              prefix:
                type: string
              is_default:
                type: boolean

VllmKeyConfig:
  type: object
  description: VLLM-specific key configuration
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    model_name:
      type: string
  required:
    - url

OllamaKeyConfig:
  type: object
  description: Ollama-specific key configuration
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
  required:
    - url

ReplicateKeyConfig:
  type: object
  description: Replicate-specific key configuration
  properties:
    use_deployments_endpoint:
      type: boolean
      description: Whether to use the deployments endpoint instead of the models endpoint

SglKeyConfig:
  type: object
  description: SGLang-specific key configuration
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
  required:
    - url

VLLMKeyConfig:
  type: object
  description: vLLM-specific key configuration for per-key routing to different vLLM instances
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: vLLM server base URL (required)
    model_name:
      type: string
      description: Exact model name served on this vLLM instance

Key:
  type: object
  description: API key configuration
  properties:
    id:
      type: string
      description: Unique identifier for the key
    name:
      type: string
      description: Name of the key
    value:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: API key value (redacted in responses)
    models:
      type: array
      items:
        type: string
      description: List of models this key can access (whitelist)
    blacklisted_models:
      type: array
      items:
        type: string
      description: List of models this key cannot access (blacklist)
    weight:
      type: number
      description: Weight for load balancing
    aliases:
      type: object
      propertyNames:
        minLength: 1
      additionalProperties:
        type: string
        minLength: 1
      description: Model alias mappings - maps a user-facing model name to a provider-specific identifier (deployment name, inference profile ID, fine-tuned model ID, etc.)
    azure_key_config:
      $ref: '#/AzureKeyConfig'
    vertex_key_config:
      $ref: '#/VertexKeyConfig'
    bedrock_key_config:
      $ref: '#/BedrockKeyConfig'
    vllm_key_config:
      $ref: '#/VllmKeyConfig'
    ollama_key_config:
      $ref: '#/OllamaKeyConfig'
    sgl_key_config:
      $ref: '#/SglKeyConfig'
    replicate_key_config:
      $ref: '#/ReplicateKeyConfig'
    enabled:
      type: boolean
      description: Whether the key is active (defaults to true)
    use_for_batch_api:
      type: boolean
      description: Whether this key can be used for batch API operations
    config_hash:
      type: string
      description: Hash of config.json version, used for change detection
    status:
      type: string
      description: Status of key (e.g., success, list_models_failed)
    description:
      type: string
      description: Error or status description for the key

AllowedRequests:
  type: object
  description: Allowed request types for custom providers
  properties:
    list_models:
      type: boolean
    text_completion:
      type: boolean
    text_completion_stream:
      type: boolean
    chat_completion:
      type: boolean
    chat_completion_stream:
      type: boolean
    responses:
      type: boolean
    responses_stream:
      type: boolean
    count_tokens:
      type: boolean
    embedding:
      type: boolean
    speech:
      type: boolean
    speech_stream:
      type: boolean
    transcription:
      type: boolean
    transcription_stream:
      type: boolean
    image_generation:
      type: boolean
    image_generation_stream:
      type: boolean
    batch_create:
      type: boolean
    batch_list:
      type: boolean
    batch_retrieve:
      type: boolean
    batch_cancel:
      type: boolean
    batch_results:
      type: boolean
    file_upload:
      type: boolean
    file_list:
      type: boolean
    file_retrieve:
      type: boolean
    file_delete:
      type: boolean
    file_content:
      type: boolean

CustomProviderConfig:
  type: object
  description: Custom provider configuration
  properties:
    is_key_less:
      type: boolean
    base_provider_type:
      $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    allowed_requests:
      $ref: '#/AllowedRequests'
    request_path_overrides:
      type: object
      additionalProperties:
        type: string

ProviderResponse:
  type: object
  description: Provider configuration response
  properties:
    name:
      $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    network_config:
      $ref: '#/NetworkConfig'
    concurrency_and_buffer_size:
      $ref: '#/ConcurrencyAndBufferSize'
    proxy_config:
      $ref: '#/ProxyConfig'
    send_back_raw_request:
      type: boolean
    send_back_raw_response:
      type: boolean
    store_raw_request_response:
      type: boolean
    custom_provider_config:
      $ref: '#/CustomProviderConfig'
    provider_status:
      $ref: '#/ProviderStatus'
    status:
      type: string
      description: Operational status (e.g., list_models_failed)
    description:
      type: string
      description: Error/status description
    config_hash:
      type: string
      description: Hash of config.json version, used for change detection

ListProvidersResponse:
  type: object
  description: List providers response
  properties:
    providers:
      type: array
      items:
        $ref: '#/ProviderResponse'
    total:
      type: integer

AddProviderRequest:
  type: object
  description: Add provider request. Keys are managed separately via /api/providers/{provider}/keys.
  required:
    - provider
  properties:
    provider:
      $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    network_config:
      $ref: '#/NetworkConfig'
    concurrency_and_buffer_size:
      $ref: '#/ConcurrencyAndBufferSize'
    proxy_config:
      $ref: '#/ProxyConfig'
    send_back_raw_request:
      type: boolean
    send_back_raw_response:
      type: boolean
    store_raw_request_response:
      type: boolean
    custom_provider_config:
      $ref: '#/CustomProviderConfig'

UpdateProviderRequest:
  type: object
  description: Update provider request. Keys are managed separately via /api/providers/{provider}/keys.
  properties:
    network_config:
      $ref: '#/NetworkConfig'
    concurrency_and_buffer_size:
      $ref: '#/ConcurrencyAndBufferSize'
    proxy_config:
      $ref: '#/ProxyConfig'
    send_back_raw_request:
      type: boolean
    send_back_raw_response:
      type: boolean
    store_raw_request_response:
      type: boolean
    custom_provider_config:
      $ref: '#/CustomProviderConfig'

ListProviderKeysResponse:
  type: object
  description: Response for listing keys for a provider
  properties:
    keys:
      type: array
      items:
        $ref: '#/Key'
    total:
      type: integer

ModelResponse:
  type: object
  description: Model information
  properties:
    name:
      type: string
    provider:
      type: string
    accessible_by_keys:
      type: array
      items:
        type: string

Architecture:
  type: object
  properties:
    modality:
      type: string
    tokenizer:
      type: string
    instruct_type:
      type: string
    input_modalities:
      type: array
      items:
        type: string
    output_modalities:
      type: array
      items:
        type: string

ModelDetailsResponse:
  type: object
  description: Model details with capability metadata
  properties:
    name:
      type: string
    provider:
      type: string
    context_length:
      type: integer
    max_input_tokens:
      type: integer
    max_output_tokens:
      type: integer
    input_cost_per_token:
      type: number
      format: double
    output_cost_per_token:
      type: number
      format: double
    cache_creation_input_token_cost:
      type: number
      format: double
    cache_read_input_token_cost:
      type: number
      format: double
    architecture:
      $ref: '#/Architecture'
    additional_attributes:
      type: object
      additionalProperties:
        type: string
    accessible_by_keys:
      type: array
      items:
        type: string

ListModelsResponse:
  type: object
  description: List models response
  properties:
    models:
      type: array
      items:
        $ref: '#/ModelResponse'
    total:
      type: integer

ListModelDetailsResponse:
  type: object
  description: List model details response
  properties:
    models:
      type: array
      items:
        $ref: '#/ModelDetailsResponse'
    total:
      type: integer

ProviderCredentialStatus:
  type: object
  required: [credential_id, provider, status, version]
  properties:
    credential_id:
      type: string
      description: Provider key ID that owns this account binding
    provider:
      type: string
      enum: [openai-codex, xai, cursor]
    account_id:
      type: string
    status:
      type: string
      enum: [connected, connecting, expired, disconnected, error]
    expires_at:
      type: string
      format: date-time
    last_refresh:
      type: string
      format: date-time
    version:
      type: integer
      format: uint64

ProviderCredentialUsage:
  type: object
  required: [credential_id, provider, availability, quotas]
  properties:
    credential_id:
      type: string
      description: Provider key ID that owns the account binding
    provider:
      type: string
      enum: [openai-codex, xai, cursor]
    availability:
      type: string
      enum: [available, unsupported, unavailable]
    fetched_at:
      type: string
      format: date-time
      description: Time the provider snapshot was successfully fetched
    stale:
      type: boolean
      description: Whether the returned provider snapshot is known to be stale
    message:
      type: string
      description: Safe provider-neutral explanation for unsupported or unavailable usage
    quotas:
      type: array
      items:
        $ref: '#/ProviderCredentialQuota'
    plan:
      $ref: '#/ProviderCredentialPlan'
    on_demand:
      $ref: '#/ProviderCredentialOnDemand'
    credits:
      $ref: '#/ProviderCredentialCredits'
    reset_credits:
      $ref: '#/ProviderCredentialResetCredits'

ProviderCredentialQuota:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      description: Stable provider-scoped quota identifier
    name:
      type: string
    description:
      type: string
    used_percent:
      type: number
      format: double
    used:
      type: number
      format: double
    limit:
      type: number
      format: double
    remaining:
      type: number
      format: double
    unit:
      type: string
      description: Unit for used, limit, and remaining values; Cursor monetary quotas use `cents`
    window_duration_minutes:
      type: integer
      format: int64
    starts_at:
      type: string
      format: date-time
    resets_at:
      type: string
      format: date-time

ProviderCredentialPlan:
  type: object
  required: [name]
  properties:
    name:
      type: string
    price:
      type: string
      description: Provider-formatted recurring plan price
    included_amount:
      type: number
      format: double
    included_unit:
      type: string
    billing_cycle_end:
      type: string
      format: date-time

ProviderCredentialOnDemand:
  type: object
  required: [enabled, can_update]
  properties:
    enabled:
      type: boolean
    can_update:
      type: boolean
      description: Whether this account permits personal on-demand settings to be updated
    used:
      type: number
      format: double
    limit:
      type: number
      format: double
    remaining:
      type: number
      format: double
    unit:
      type: string
    limit_type:
      type: string
    disabled_reason:
      type: string

UpdateProviderCredentialOnDemandRequest:
  type: object
  required: [enabled, limit_dollars]
  properties:
    enabled:
      type: boolean
    limit_dollars:
      type: integer
      format: int32
      minimum: 0
      description: Monthly on-demand spending limit in whole US dollars; must be positive when enabled
    expected_enabled:
      type: boolean
      description: Last observed enabled state used to prevent overwriting a concurrent change
    expected_limit_dollars:
      type: integer
      format: int32
      minimum: 0
      description: Last observed whole-dollar limit used to prevent overwriting a concurrent change

ProviderCredentialCredits:
  type: object
  required: [has_credits, unlimited]
  properties:
    has_credits:
      type: boolean
    unlimited:
      type: boolean
    balance:
      type: number
      format: double

ProviderCredentialResetCredits:
  type: object
  required: [available_count, credits]
  properties:
    available_count:
      type: integer
      format: int64
    credits:
      type: array
      description: Best-effort reset-credit detail rows. An empty array means no rows were returned or the bounded detail read was unavailable.
      items:
        $ref: '#/ProviderCredentialResetCredit'

ProviderCredentialResetCredit:
  type: object
  required: [id, reset_type, status]
  properties:
    id:
      type: string
    reset_type:
      type: string
    status:
      type: string
    granted_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
    title:
      type: string
    description:
      type: string

ListProviderCredentialsResponse:
  type: object
  required: [credentials, total]
  properties:
    credentials:
      type: array
      items:
        $ref: '#/ProviderCredentialStatus'
    total:
      type: integer

ProviderCredentialLoginStatus:
  type: object
  required: [login_id, credential_id, provider, status]
  properties:
    login_id:
      type: string
    credential_id:
      type: string
    provider:
      type: string
      enum: [openai-codex, xai, cursor]
    status:
      type: string
      enum: [connecting, connected, disconnected, error]
    verification_url:
      type: string
      format: uri
    user_code:
      type: string
    expires_at:
      type: string
      format: date-time
    poll_interval_seconds:
      type: integer
    error_code:
      type: string
