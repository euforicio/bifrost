syntax = "proto3";

package agent.v1;

option go_package = "github.com/maximhq/bifrost/core/providers/cursor/cursorpb";

// Minimal Cursor AgentService wire schema. Field numbers are the compatibility
// contract; unrelated Cursor IDE messages are intentionally omitted.
message AgentClientMessage {
  oneof message {
    AgentRunRequest run_request = 1;
    ExecClientMessage exec_client_message = 2;
    KvClientMessage kv_client_message = 3;
    ExecClientControlMessage exec_client_control_message = 5;
    InteractionResponse interaction_response = 6;
    ClientHeartbeat client_heartbeat = 7;
  }
}

message AgentServerMessage {
  oneof message {
    InteractionUpdate interaction_update = 1;
    ExecServerMessage exec_server_message = 2;
    ConversationStateStructure conversation_checkpoint_update = 3;
    KvServerMessage kv_server_message = 4;
    InteractionQuery interaction_query = 7;
  }
}

message AgentRunRequest {
  ConversationStateStructure conversation_state = 1;
  ConversationAction action = 2;
  ModelDetails model_details = 3;
  McpTools mcp_tools = 4;
  optional string conversation_id = 5;
  optional RequestedModel requested_model = 9;
}

message ConversationStateStructure {
  repeated bytes root_prompt_messages_json = 1;
  ConversationTokenDetails token_details = 5;
}
message ConversationTokenDetails { uint32 used_tokens = 1; uint32 max_tokens = 2; }

message ConversationAction {
  oneof action {
    UserMessageAction user_message_action = 1;
    ResumeAction resume_action = 2;
  }
}
message UserMessageAction { UserMessage user_message = 1; }
message UserMessage { string text = 1; string message_id = 2; }
message ResumeAction {}

message ModelDetails {
  string model_id = 1;
  optional ThinkingDetails thinking_details = 2;
  string display_model_id = 3;
  string display_name = 4;
  string display_name_short = 5;
  repeated string aliases = 6;
}
message ThinkingDetails {}
message RequestedModel { string model_id = 1; bool max_mode = 2; }
message McpTools { repeated McpToolDefinition mcp_tools = 1; }
message McpToolDefinition {
  string name = 1;
  string description = 2;
  bytes input_schema = 3;
  string provider_identifier = 4;
  string tool_name = 5;
}

message InteractionUpdate {
  oneof message {
    TextDeltaUpdate text_delta = 1;
    ThinkingDeltaUpdate thinking_delta = 4;
    TokenDeltaUpdate token_delta = 8;
    TurnEndedUpdate turn_ended = 14;
  }
}
message TextDeltaUpdate { string text = 1; }
message ThinkingDeltaUpdate { string text = 1; }
message TokenDeltaUpdate { int32 tokens = 1; }
message TurnEndedUpdate {}

message ExecServerMessage {
  uint32 id = 1;
  oneof message {
    ShellArgs shell_args = 2;
    WriteArgs write_args = 3;
    DeleteArgs delete_args = 4;
    GrepArgs grep_args = 5;
    ReadArgs read_args = 7;
    LsArgs ls_args = 8;
    DiagnosticsArgs diagnostics_args = 9;
    RequestContextArgs request_context_args = 10;
    McpArgs mcp_args = 11;
    ShellArgs shell_stream_args = 14;
    FetchArgs fetch_args = 20;
  }
  string exec_id = 15;
}

message ExecClientMessage {
  uint32 id = 1;
  oneof message {
    ShellResult shell_result = 2;
    WriteResult write_result = 3;
    DeleteResult delete_result = 4;
    GrepResult grep_result = 5;
    ReadResult read_result = 7;
    LsResult ls_result = 8;
    DiagnosticsResult diagnostics_result = 9;
    RequestContextResult request_context_result = 10;
    McpResult mcp_result = 11;
    ShellStream shell_stream = 14;
    FetchResult fetch_result = 20;
  }
  string exec_id = 15;
}

message ExecClientControlMessage { oneof message { ExecClientStreamClose stream_close = 1; } }
message ExecClientStreamClose { uint32 id = 1; }

message ShellArgs { string command = 1; string working_directory = 2; int32 timeout = 3; string tool_call_id = 4; }
message ShellResult { oneof result { ShellSuccess success = 1; ShellRejected rejected = 4; } }
message ShellSuccess {
  string command = 1; string working_directory = 2; int32 exit_code = 3;
  string signal = 4; string stdout = 5; string stderr = 6; int32 execution_time = 7;
}
message ShellRejected { string command = 1; string working_directory = 2; string reason = 3; bool is_readonly = 4; }
message ShellStream {
  oneof event {
    ShellStreamStdout stdout = 1;
    ShellStreamExit exit = 3;
    ShellStreamStart start = 4;
    ShellRejected rejected = 5;
  }
}
message ShellStreamStdout { string data = 1; }
message ShellStreamExit { uint32 code = 1; string cwd = 2; bool aborted = 4; }
message ShellStreamStart {}

message ReadArgs { string path = 1; string tool_call_id = 2; }
message ReadResult { oneof result { ReadRejected rejected = 3; } }
message ReadRejected { string path = 1; string reason = 2; }
message WriteArgs { string path = 1; string file_text = 2; string tool_call_id = 3; bytes file_bytes = 5; }
message WriteResult { oneof result { WriteRejected rejected = 6; } }
message WriteRejected { string path = 1; string reason = 2; }
message DeleteArgs { string path = 1; string tool_call_id = 2; }
message DeleteResult { oneof result { DeleteRejected rejected = 6; } }
message DeleteRejected { string path = 1; string reason = 2; }
message GrepArgs { string pattern = 1; optional string path = 2; optional string glob = 3; string tool_call_id = 14; }
message GrepResult { oneof result { GrepError error = 2; } }
message GrepError { string error = 1; }
message LsArgs { string path = 1; repeated string ignore = 2; string tool_call_id = 3; }
message LsResult { oneof result { LsRejected rejected = 3; } }
message LsRejected { string path = 1; string reason = 2; }
message FetchArgs { string url = 1; string tool_call_id = 2; }
message FetchResult { oneof result { FetchError error = 2; } }
message FetchError { string url = 1; string error = 2; }
message DiagnosticsArgs { string path = 1; string tool_call_id = 2; }
message DiagnosticsResult {}
message RequestContextArgs {}
message RequestContextResult { oneof result { RequestContextSuccess success = 1; } }
message RequestContextSuccess { RequestContext request_context = 1; }
message RequestContext {
  repeated McpToolDefinition tools = 7;
  optional string cloud_rule = 16;
  bool web_search_enabled = 17;
  bool web_fetch_enabled = 24;
}

message McpArgs {
  string name = 1;
  map<string, bytes> args = 2;
  string tool_call_id = 3;
  string provider_identifier = 4;
  string tool_name = 5;
}
message McpResult { oneof result { McpSuccess success = 1; McpError error = 2; } }
message McpSuccess { repeated McpToolResultContentItem content = 1; }
message McpError { string error = 1; }
message McpToolResultContentItem { oneof content { McpTextContent text = 1; } }
message McpTextContent { string text = 1; }

message KvServerMessage {
  uint32 id = 1;
  oneof message { GetBlobArgs get_blob_args = 2; SetBlobArgs set_blob_args = 3; }
}
message KvClientMessage {
  uint32 id = 1;
  oneof message { GetBlobResult get_blob_result = 2; SetBlobResult set_blob_result = 3; }
}
message GetBlobArgs { bytes blob_id = 1; }
message GetBlobResult { bytes blob_data = 1; }
message SetBlobArgs { bytes blob_id = 1; bytes blob_data = 2; }
message SetBlobResult {}
message ClientHeartbeat {}

message GetUsableModelsRequest { repeated string custom_model_ids = 1; }
message GetUsableModelsResponse { repeated ModelDetails models = 1; }

message InteractionQuery {
  uint32 id = 1;
  oneof query {
    WebSearchRequestQuery web_search_request_query = 2;
    WebFetchRequestQuery web_fetch_request_query = 9;
  }
}
message WebSearchRequestQuery { WebSearchArgs args = 1; }
message WebSearchArgs { string search_term = 1; string tool_call_id = 2; }
message WebFetchRequestQuery { WebFetchArgs args = 1; }
message WebFetchArgs { string url = 1; string tool_call_id = 2; }

message InteractionResponse {
  uint32 id = 1;
  oneof response {
    WebSearchRequestResponse web_search_request_response = 2;
    WebFetchRequestResponse web_fetch_request_response = 9;
  }
}
message WebSearchRequestResponse { oneof response { InteractionApproved approved = 1; } }
message WebFetchRequestResponse { oneof response { InteractionApproved approved = 1; } }
message InteractionApproved {}
