name: Roll back Orion

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Previously deployed ghcr.io/euforicio/bifrost@sha256:... reference"
        required: true
        type: string

concurrency:
  group: bifrost-orion-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: orion-production
      url: https://bifrost.riftlabs.app
    env:
      ORION_HOST: ${{ secrets.ORION_HOST || '31.97.143.81' }}
      ORION_USER: ${{ secrets.ORION_USER || 'root' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout Bifrost deployment helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout Orion GitOps repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: euforicio/orion-infra
          ref: main
          token: ${{ secrets.ORION_INFRA_TOKEN }}
          path: orion-infra

      - name: Promote selected rollback image through GitOps
        env:
          IMAGE: ${{ inputs.image }}
        run: deploy/orion/orion-push.sh "$IMAGE" orion-infra "$GITHUB_ACTOR"
