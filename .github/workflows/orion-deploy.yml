name: Deploy Orion image

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Production operation"
        required: true
        type: choice
        options: [deploy, rollback]
      digest:
        description: "Validated GHCR digest (required for deploy)"
        required: false
        type: string

concurrency:
  group: bifrost-orion-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  ORION_HOST: 31.97.143.81
  ORION_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: orion-production
      url: https://bifrost.riftlabs.app
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            31.97.143.81:22
            api.github.com:443
            bifrost.riftlabs.app:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout pinned host key
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate operation
        id: operation
        env:
          OPERATION: ${{ inputs.operation }}
          DIGEST: ${{ inputs.digest }}
        run: |
          if [[ "$OPERATION" == deploy ]]; then
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "deploy requires a sha256 digest" >&2
              exit 64
            fi
            echo "command=deploy ghcr.io/euforicio/bifrost@${DIGEST} ${GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"
          else
            echo "command=rollback ${GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure restricted SSH access
        env:
          ORION_SSH_PRIVATE_KEY: ${{ secrets.ORION_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/orion"
          printf '%s\n' "$ORION_SSH_PRIVATE_KEY" > "$HOME/.ssh/orion"
          install -m 0600 deploy/orion/known_hosts "$HOME/.ssh/known_hosts"

      - name: Run restricted production operation
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_COMMAND: ${{ steps.operation.outputs.command }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$HOME/.ssh/orion" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${ORION_USER}@${ORION_HOST}" \
            "$DEPLOY_COMMAND"

      - name: Verify public health and authentication
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          verify_public() {
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              https://bifrost.riftlabs.app/health >/dev/null \
              && curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                https://bifrost.riftlabs.app/ >/dev/null \
              && [[ $(curl --silent --output /dev/null --write-out '%{http_code}' \
                --request POST \
                --header 'Content-Type: application/json' \
                --data '{}' \
                https://bifrost.riftlabs.app/v1/chat/completions) == 401 ]]
          }
          if verify_public; then
            exit 0
          fi
          if [[ "$OPERATION" != deploy ]]; then
            echo "public verification failed after rollback" >&2
            exit 1
          fi
          echo "public verification failed; rolling back production" >&2
          rollback_result=$(printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$HOME/.ssh/orion" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${ORION_USER}@${ORION_HOST}" \
            "rollback ${GITHUB_ACTOR}")
          if [[ "$rollback_result" == "none stopped" ]]; then
            rollback_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              https://bifrost.riftlabs.app/health || true)
            if [[ "$rollback_status" =~ ^2 ]]; then
              echo "first-deploy rollback left a public service running" >&2
              exit 1
            fi
          else
            verify_public
          fi
          echo "deployment was rolled back after public verification failed" >&2
          exit 1
