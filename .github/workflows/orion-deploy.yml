name: Build and deploy Orion

on:
  push:
    branches: ["feature/codex-xai-account-auth"]
    paths:
      - ".github/workflows/orion-deploy.yml"
      - "core/**"
      - "deploy/orion/**"
      - "framework/**"
      - "plugins/**"
      - "transports/**"
      - "ui/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the validated image to Orion"
        required: true
        type: boolean
        default: false

concurrency:
  group: bifrost-orion-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  ORION_HOST: 31.97.143.81
  ORION_USER: root

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.0"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Validate provider account implementation
        run: |
          source ./.github/workflows/scripts/setup-go-workspace.sh
          (cd core && go test ./providers/openaicodex ./providers/xai ./providers/cursor)
          (cd framework && go test ./providercredentials ./configstore ./configstore/tables)
          (cd transports && go test ./bifrost-http/handlers ./bifrost-http/lib -run 'ProviderCredential|ProviderAccount|Account|RemoveProvider')
          (cd ui && npm ci && npm run typecheck && npm run build-enterprise)

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          repository=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "sha=ghcr.io/${repository}:orion-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repository}:orion-latest" >> "$GITHUB_OUTPUT"

      - name: Build and push checked-out sources
        id: build
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile.local
          platforms: linux/amd64
          build-args: VERSION=0.0.0-${{ github.sha }}
          tags: |
            ${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.latest }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Record immutable image reference
        id: image
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "reference=${IMAGE_TAG}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Boot-smoke immutable image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          cleanup() {
            docker logs bifrost-orion-smoke || true
            docker rm -f bifrost-orion-smoke || true
          }
          trap cleanup EXIT
          docker run --detach --name bifrost-orion-smoke \
            --publish 127.0.0.1:18080:8080 \
            --env BIFROST_ENCRYPTION_KEY=test-only-orion-encryption-key \
            --env BIFROST_SETUP_TOKEN=test-only-orion-setup-token \
            "$IMAGE"
          for _ in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: orion-production
      url: https://bifrost.riftlabs.cc
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            31.97.143.81:22
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout deployment host key
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure pinned SSH access
        env:
          ORION_SSH_PRIVATE_KEY: ${{ secrets.ORION_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/orion"
          printf '%s\n' "$ORION_SSH_PRIVATE_KEY" > "$HOME/.ssh/orion"
          install -m 0600 deploy/orion/known_hosts "$HOME/.ssh/known_hosts"

      - name: Deploy immutable image through restricted command
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/orion" "${ORION_USER}@${ORION_HOST}" \
            "deploy $IMAGE"

      - name: Verify public health endpoint
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 https://bifrost.riftlabs.cc/health >/dev/null
