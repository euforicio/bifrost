name: Validate, publish, and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: bifrost-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            127.0.0.1:18884
            api.github.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            vuln.go.dev:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Validate provider account implementation
        run: |
          source ./.github/workflows/scripts/setup-go-workspace.sh
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          (cd transports && govulncheck -tags sqlite_static,cloudflare ./bifrost-http)
          npm audit --prefix ui --package-lock-only --audit-level=low
          (cd core && go test ./providers/openai -run 'StripsGeminiResidueFromResponsesInput|MantleGPTOSSReplaysAssistantTextAsInput')
          (cd transports && go test ./bifrost-http/lib)
          (cd core && go test ./providers/openaicodex ./providers/xai ./providers/cursor ./providers/fireworks ./providers/ollama)
          (cd framework && go test ./providercredentials ./configstore ./configstore/tables ./modelcatalog/datasheet)
          (cd deploy/cloudflare && npm ci && npm test)
          (cd transports && go test ./bifrost-http/handlers ./bifrost-http/lib -run 'ProviderCredential|ProviderAccount|Account|RemoveProvider')
          node --test tests/e2e/api/runners/lib/provider-capabilities.test.mjs
          (cd ui && npm ci && npm run build-enterprise)

      - name: Preserve checked frontend assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bifrost-web
          path: ui/out
          retention-days: 1
          if-no-files-found: error

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.reference.outputs.image }}
      variant: ${{ steps.tag.outputs.variant }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            127.0.0.1:18080
            127.0.0.1:18884
            127.0.0.1:18885
            nodejs.org:443
            api.github.com:443
            auth.docker.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image tag
        id: tag
        run: |
          repository=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          variant=${{ vars.CLOUDFLARE_PRODUCTION_ENABLED == 'true' && 'cloudflare' || 'orion' }}
          echo "value=ghcr.io/${repository}:${variant}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "variant=${variant}" >> "$GITHUB_OUTPUT"

      - name: Build and push checked-out sources
        id: build
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile.local
          platforms: linux/amd64
          build-args: |
            VERSION=0.0.0-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            CLOUDFLARE_STORAGE=${{ steps.tag.outputs.variant == 'cloudflare' }}
          tags: ${{ steps.tag.outputs.value }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Set up Node for exact native image qualification
        if: steps.tag.outputs.variant == 'cloudflare'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Qualify exact Cloudflare image against native SQL and R2
        if: steps.tag.outputs.variant == 'cloudflare'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          npm ci --prefix deploy/cloudflare
          node deploy/cloudflare/test-image.mjs "ghcr.io/euforicio/bifrost@${IMAGE_DIGEST}" "$GITHUB_SHA"
      - name: Boot-smoke immutable image
        if: steps.tag.outputs.variant == 'orion'
        env:
          IMAGE: ${{ steps.tag.outputs.value }}@${{ steps.build.outputs.digest }}
        run: |
          # shellcheck disable=SC2329
          cleanup() {
            docker logs bifrost-orion-smoke || true
            docker rm -f bifrost-orion-smoke || true
          }
          trap cleanup EXIT
          docker run --detach --name bifrost-orion-smoke \
            --publish 127.0.0.1:18080:8080 \
            --env APP_DIR=/tmp/bifrost-boot-smoke \
            --env BIFROST_ENCRYPTION_KEY=test-only-orion-encryption-key \
            --env BIFROST_SETUP_TOKEN=test-only-orion-setup-token \
            "$IMAGE"
          for _ in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish immutable deployment reference
        id: reference
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_repository=${IMAGE_TAG%:*}
          echo "image=${image_repository}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo '### Orion image'
            echo
            echo "\`${IMAGE_TAG}@${IMAGE_DIGEST}\`"
            echo
            echo "Deploy digest: \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.variant == 'orion'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: orion-production
      url: https://bifrost.riftlabs.app
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout Bifrost deployment helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout Orion GitOps repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: euforicio/orion-infra
          ref: main
          token: ${{ secrets.ORION_INFRA_TOKEN }}
          path: orion-infra

      - name: Promote immutable image through GitOps
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: deploy/orion/orion-push.sh "$IMAGE" orion-infra "$GITHUB_ACTOR"

  promote-cloudflare:
    permissions:
      contents: read
      packages: read
    if: github.ref == 'refs/heads/main' && needs.build.outputs.variant == 'cloudflare'
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: dd99a5f86972717d02d06b52cba6ab5d
    steps:
      - name: Check out qualified application source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Require current application main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api repos/euforicio/bifrost/commits/main --jq .sha)" = "$GITHUB_SHA"
      - name: Check out deployment infrastructure
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: euforicio/orion-infra
          ref: main
          token: ${{ secrets.ORION_INFRA_TOKEN }}
          path: infrastructure
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bifrost-web
          path: ${{ runner.temp }}/bifrost-web
      - name: Install pinned deployment dependencies
        working-directory: infrastructure
        run: |
          npm ci --prefix cloudflare
      - name: Require recorded production cutover
        working-directory: infrastructure
        run: node cloudflare/scripts/require-production.mjs bifrost "$GITHUB_WORKSPACE"
      - name: Mirror checked immutable image to Cloudflare
        working-directory: infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: node cloudflare/scripts/mirror-image.mjs bifrost "$IMAGE" "$GITHUB_SHA" "$RUNNER_TEMP/bifrost-image.json"
      - name: Promote backend release
        working-directory: infrastructure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node cloudflare/scripts/promote-release.mjs bifrost "$GITHUB_SHA" "$RUNNER_TEMP/bifrost-image.json"
      - name: Verify checked backend before frontend deployment
        working-directory: infrastructure
        run: node cloudflare/scripts/verify-product-release.mjs bifrost "$GITHUB_SHA"
      - name: Deploy checked frontend CDN assets
        working-directory: infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node cloudflare/scripts/prepare-frontend.mjs bifrost "$RUNNER_TEMP/bifrost-web"
          (cd cloudflare && npx wrangler deploy --config frontends/bifrost/wrangler.jsonc)
