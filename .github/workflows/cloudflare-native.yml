name: Qualify native Cloudflare image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            127.0.0.1:18884
            127.0.0.1:18885
            api.github.com:443
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            vuln.go.dev:443
      - name: Check out exact qualification source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Set up patched Go compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check actual production workspace dependencies
        run: |
          go work init ./core ./framework ./transports
          for plugin_dir in ./plugins/*/; do
            if [ -f "$plugin_dir/go.mod" ]; then go work use "$plugin_dir"; fi
          done
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          (cd transports && govulncheck -tags sqlite_static,cloudflare ./bifrost-http)
          npm audit --prefix ui --package-lock-only --audit-level=low
      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - name: Build production native variant for qualification
        id: build
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile.local
          platforms: linux/amd64
          build-args: |
            VERSION=0.0.0-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            CLOUDFLARE_STORAGE=true
          push: false
          load: true
      - name: Qualify immutable image against real native SQL and R2
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          npm ci --prefix deploy/cloudflare
          node deploy/cloudflare/test-image.mjs "$IMAGE_ID" "$GITHUB_SHA"
