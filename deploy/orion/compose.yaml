name: bifrost-orion

services:
  bifrost:
    image: ${BIFROST_IMAGE:?immutable image reference is required}
    container_name: bifrost
    restart: unless-stopped
    ports:
      - "127.0.0.1:8180:8080"
    env_file:
      - .env
    environment:
      APP_DIR: /app/data
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      LOG_LEVEL: info
      LOG_STYLE: json
    volumes:
      - ./data:/app/data
      - ./config.json:/app/data/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 9
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 512
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
